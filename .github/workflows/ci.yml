name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-build-and-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spring-boot-rest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: transfer_db
          POSTGRES_USER: transfer_user
          POSTGRES_PASSWORD: transfer_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Build and run tests
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/transfer_db
        SPRING_DATASOURCE_USERNAME: transfer_user
        SPRING_DATASOURCE_PASSWORD: transfer_password
      run: mvn -B verify

  frontend-build-and-test:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      
    - name: Type check (if applicable)
      run: npm run typecheck --if-present
      
    - name: Run tests
      run: npm test --if-present
      
    - name: Build frontend
      run: npm run build
