# Production configuration profile

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Storage - use Backblaze B2 in production
storage.type=b2
b2.bucket=${STORAGE_BUCKET}
b2.endpoint=${STORAGE_ENDPOINT}
b2.access-key=${STORAGE_ACCESS_KEY}
b2.secret-key=${STORAGE_SECRET_KEY}
b2.region=${STORAGE_REGION}

# Chunk limits matching optimal benchmark
transfer.chunk-size-bytes=${MAX_CHUNK_SIZE:8388608}
spring.servlet.multipart.max-request-size=40MB
spring.servlet.multipart.max-file-size=50000MB
server.tomcat.connection-timeout=120000

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
