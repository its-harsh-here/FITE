spring.profiles.active=dev
server.port=8080

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/transfer_db
spring.datasource.username=transfer_user
spring.datasource.password=transfer_password
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Storage configuration
storage.local.directory=${java.io.tmpdir}/transfer-chunks

# Chunk Size (Default 8MB)
transfer.chunk-size-bytes=8388608

# Security: Request size bounds (e.g. 50GB file, 10MB chunk/request limit)
spring.servlet.multipart.max-file-size=50000MB
spring.servlet.multipart.max-request-size=10MB

# Security: Connection timeouts
server.tomcat.connection-timeout=30s

# Security: CORS
cors.allowed-origins=http://localhost:5173